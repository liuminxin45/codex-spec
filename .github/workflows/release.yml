name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: codex-spec check --kind source --repo-root . --json
      - name: Check tag and build
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(codex-spec --version)"
          python -m build
          python scripts/smoke_distribution.py
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --title "Codex Spec $GITHUB_REF_NAME" --notes-file docs/releases/0.1.0.md --latest
