name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: codex-spec check --kind source --repo-root . --json
      - shell: pwsh
        run: |
          ./scripts/powershell/validate-generated-context.ps1 -RepoRoot . -Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/powershell/validate-knowledge-index.ps1 -RepoRoot . -Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/powershell/validate-context-budget.ps1 -RepoRoot . -Json
          exit $LASTEXITCODE
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/smoke_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
