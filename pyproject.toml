[project]
name = "codex-spec"
version = "0.1.1"
description = "Lightweight engineering guidance for complex software changes with Codex."
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Codex Spec contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/liuminxin45/codex-spec"
Issues = "https://github.com/liuminxin45/codex-spec/issues"

[project.scripts]
codex-spec = "codex_spec.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_spec"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/evals", "/docs", "/specs", "/README.md", "/README.en.md", "/LICENSE", "/AGENTS.md", "/.gitattributes"]
